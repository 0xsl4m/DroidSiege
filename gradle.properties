# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure; Jetifier stays off (no legacy support libraries).
android.useAndroidX=true
android.enableJetifier=false

# Only keep the R class entries for the module that declares a resource.
android.nonTransitiveRClass=true

# Official Kotlin code style.
kotlin.code.style=official

# compileSdk 35 is ahead of what AGP 8.5.2 was tested against; silence the advisory.
android.suppressUnsupportedCompileSdk=35

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
